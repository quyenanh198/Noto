# Phục vụ SPA dưới /noto/. Vite sinh tên file có hash trong assets/ nên cache
# lâu được; index.html luôn phải tươi để bản mới lên ngay.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  # Sau caddy/Cloudflare: redirect phải giữ tương đối, không nginx dựng lại
  # thành http://host:8080/... theo cổng nó nghe.
  absolute_redirect off;

  location = /healthz { add_header Content-Type text/plain; return 200 'ok'; }
  location = / { return 302 /noto/; }
  location = /noto { return 301 /noto/; }

  location ^~ /noto/assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }

  location /noto/ {
    add_header Cache-Control "no-store";
    try_files $uri $uri/ /noto/index.html;
  }
}
